<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero {
            text-align: center;
            padding: 50px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .hero h1 {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .hero h2 {
            font-size: 18px;
            color: #666666;
            margin-bottom: 20px;
        }

        .hero button {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .hero button:hover {
            background-color: #0069d9;
        }

        .features {
            padding: 50px;
        }

        .features .card {
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .features .card h3 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .persona {
            padding: 50px;
        }

        .persona .card {
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .persona .card h3 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .cta {
            background-color: #007bff;
            padding: 20px;
            text-align: center;
        }

        .cta button {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .cta button:hover {
            background-color: #0069d9;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Email Assistant</h1>
        <h2>Save time with AI-powered email responses</h2>
        <button>Get Started</button>
    </div>
    <div class="features">
        <div class="card">
            <h3>Smart Reply Generation</h3>
            <p>Generates context-aware email responses</p>
        </div>
    </div>
    <div class="persona">
        <h2>Meet Our User</h2>
        <div class="card">
            <h3>Default User</h3>
            <p>Spends too much time writing repetitive email replies</p>
        </div>
    </div>
    <div class="cta">
        <h2>Sign Up for Free</h2>
        <button>Get Started</button>
    </div>
</body>
</html>
